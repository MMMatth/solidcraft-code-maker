[package]
name = "code-maker-src"
version = "0.7.0"
edition = "2024"
license = "MIT"

# A crate of its own, not part of any workspace around it.
[workspace]

[dependencies]
# The codes and barcodes: only the encoders, none of the image or reader parts.
rxing = { version = "0.9", default-features = false, features = ["encoding_rs", "encoders", "oned", "datamatrix", "aztec", "pdf417", "qrcode"] }
serde_json = "1"
wit-bindgen = "0.63"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
strip = true
