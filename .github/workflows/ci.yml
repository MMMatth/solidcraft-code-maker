name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: code-maker-src
      - name: Install wasm-tools
        run: cargo install wasm-tools --locked --version 1.263.0
      - name: Clippy
        run: cargo clippy --manifest-path code-maker-src/Cargo.toml --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Build the zip
        run: scripts/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: code-maker-zip
          path: dist/*.zip
