name: Security

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    # Every Monday, so a new advisory on a dependency shows up without a push.
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # On a pull request the action lists its commits through the API.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so a secret removed in a later commit is still found.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No comment on the pull request: a Dependabot pull request has no right to write one.
          GITLEAKS_ENABLE_COMMENTS: "false"
          # Only needed when the repository belongs to an organisation: https://gitleaks.io
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  audit:
    name: Dependencies (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Known vulnerabilities in Cargo.lock
        run: cargo audit --file qr-code-src/Cargo.lock --deny warnings

  dependency-review:
    name: Dependencies (new in the pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  workflows:
    name: Workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint the workflow files
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
