name: Release

# Push a tag such as v0.1.0 (it must match the version in plugin.json) to publish the zip.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the manifest
        run: |
          version=$(sed -n 's/^  "version": "\(.*\)",/\1/p' code-maker/plugin.json)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != plugin.json v$version" >&2; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: code-maker-src
      - name: Install wasm-tools
        run: cargo install wasm-tools --locked --version 1.263.0
      - name: Build the zip
        run: scripts/package.sh
      - name: Checksum
        run: cd dist && sha256sum -- *.zip > SHA256SUMS
      - name: Notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "no section for $version in CHANGELOG.md" >&2; exit 1; }
          cat notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --title "Code Maker $GITHUB_REF_NAME" --notes-file notes.md
